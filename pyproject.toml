[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citation-grounding-verifier"
version = "0.1.0"
description = "Source-grounded claim verification with auditable evaluations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "anthropic>=0.86,<1",
  "python-dotenv>=1,<2",
  "filelock>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
verify-bench = "grounding_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grounding_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Preserve the historical executed audit, including its original cell formatting.
extend-exclude = ["reviews/gold/gold-dataset-audit-2026-10-15.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
